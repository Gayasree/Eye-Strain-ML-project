{% extends "base.html" %}
{% block title %}Admin Login - Eye Strain Predictor{% endblock %}

{% block content %}
<div class="container">
    <div class="login-wrapper">

        <div class="login-card">
            <div class="login-icon">&#128274;</div>
            <h1 class="page-title" style="text-align:center; font-size:1.6rem;">Admin Access</h1>
            <p class="page-subtitle" style="text-align:center;">
                The Model Information page is restricted.<br>Enter the admin password to continue.
            </p>

            {% if error %}
            <div class="error-msg">&#9888;&nbsp; {{ error }}</div>
            {% endif %}

            <form method="POST" action="/admin-login">
                <div class="form-group">
                    <label for="password">Admin Password</label>
                    <div class="password-wrap">
                        <input type="password" id="password" name="password"
                               placeholder="Enter admin password"
                               autocomplete="current-password" required autofocus>
                        <button type="button" class="toggle-pw" onclick="togglePw()" title="Show/hide password">
                            &#128065;
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-submit" style="margin-top:1.25rem;">
                    &#128275; Unlock Model Info
                </button>
            </form>

            <div style="text-align:center; margin-top:1.25rem;">
                <a href="/" style="color:#718096; font-size:0.88rem; text-decoration:none;">
                    &#8592; Back to Home
                </a>
            </div>
        </div>

    </div>
</div>

<script>
function togglePw() {
    const inp = document.getElementById("password");
    inp.type = inp.type === "password" ? "text" : "password";
}
</script>
{% endblock %}
