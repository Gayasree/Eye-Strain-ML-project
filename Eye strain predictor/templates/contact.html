{% extends "base.html" %}
{% block title %}Contact - Eye Strain Predictor{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <h1 class="page-title">&#128222; Contact</h1>
        <p class="page-subtitle">Have questions or feedback? We'd love to hear from you.</p>


        <h2 style="font-size:1.1rem; color:#1a365d; margin-bottom:1rem;">Send a Message</h2>
        <form onsubmit="handleSubmit(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label for="c_name">Your Name</label>
                    <input type="text" id="c_name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="c_email">Email Address</label>
                    <input type="email" id="c_email" placeholder="Enter your email" required>
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label for="c_msg">Message</label>
                    <textarea id="c_msg" rows="4" required
                        style="padding:0.6rem 0.85rem; border:1.5px solid #cbd5e0; border-radius:7px;
                               font-size:0.95rem; background:#f7fafc; resize:vertical; outline:none;
                               font-family:inherit;"
                        placeholder="Write your message here..."></textarea>
                </div>
            </div>
            <button type="submit" class="btn btn-submit" style="margin-top:1rem;">&#128231; Send Message</button>
        </form>
        <div id="success-msg" style="display:none; margin-top:1rem;"
             class="tips-list"><li>&#9989; Thank you! Your message has been received.</li></div>
    </div>
</div>

<script>
function handleSubmit(e) {
    e.preventDefault();
    document.getElementById("success-msg").style.display = "block";
    e.target.reset();
}
</script>
{% endblock %}
